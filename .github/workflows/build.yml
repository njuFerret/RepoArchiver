name: Remote Repo Archiver

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: '请输入要检出的 GitHub 仓库 URL'
        required: true
        default: ''

jobs:
  build:
    name: Build and Compress
    runs-on: ubuntu-latest
    outputs:
      repo_name: ${{ steps.vars.outputs.repo_name }}
      date: ${{ steps.vars.outputs.date }}
      filename: ${{ steps.vars.outputs.filename }}
      clone_status: ${{ steps.clone.outcome }}

    steps:
      - name: Set Variables
        id: vars
        run: |
          DATE=$(date +'%Y-%m-%d')
          # 提取仓库名：处理 https://github.com/user/repo 这种格式
          REPO_NAME=$(echo "${{ github.event.inputs.repo_url }}" | sed 's/.*\///;s/\.git$//')
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "filename=${REPO_NAME}_${DATE}.7z" >> $GITHUB_OUTPUT

      - name: Clone Remote Repository
        id: clone
        continue-on-error: true
        run: |
          git clone --depth 1 ${{ github.event.inputs.repo_url }} ./target_repo

      - name: Compress to 7z
        if: steps.clone.outcome == 'success'
        run: |
          sudo apt-get install -y p7zip-full
          # 压缩目标文件夹内容，排除 .git 目录
          7z a -t7z "${{ steps.vars.outputs.filename }}" ./target_repo/* -xr'!.git'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: archive-payload
          # 即使失败也上传，用于后续判断
          path: |
            *.7z
          if-no-files-found: warn

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    # 核心设置：通过声明权限免去手动设置 Token 的麻烦
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: archive-payload

      # 场景 1：成功时发布压缩包
      - name: Upload to Release
        if: needs.build.outputs.clone_status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.7z"
          tag_name: ${{ needs.build.outputs.date }}
          name: "Archive: ${{ needs.build.outputs.repo_name }} (${{ needs.build.outputs.date }})"
          body: |
            ### 归档成功
            - **源仓库**: ${{ github.event.inputs.repo_url }}
            - **打包日期**: ${{ needs.build.outputs.date }}
            - **格式**: 7z (Standard)

      # 场景 2：URL 无效或克隆失败时发布错误提示
      - name: Post URL Error Release
        if: needs.build.outputs.clone_status == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "url_error_${{ github.run_id }}"
          name: "Error: Invalid URL or Private Repo"
          body: |
            无法检出指定的 URL: `${{ github.event.inputs.repo_url }}`
            请确认 URL 是否正确且该仓库为公开仓库。