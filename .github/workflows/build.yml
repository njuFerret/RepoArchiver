name: Remote Repo Archiver

on:
  push:
    branches: [main, master]
    tags-ignore: ['*']
  workflow_dispatch:
    inputs:
      repo_url:
        description: '手动输入仓库 URL'
        required: false

jobs:
  build:
    name: Extract and Compress
    runs-on: ubuntu-latest
    outputs:
      target_url: ${{ steps.vars.outputs.target_url }}
      repo_name: ${{ steps.vars.outputs.repo_name }}
      date: ${{ steps.vars.outputs.date }}
      filename: ${{ steps.vars.outputs.filename }}
      clone_status: ${{ steps.clone.outcome }}

    steps:
      - name: Set Variables
        id: vars
        run: |
          DATE=$(date +'%Y-%m-%d')
          
          # 判断触发方式并提取 URL
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            TARGET_URL="${{ github.event.inputs.repo_url }}"
          else
            # 从提交日志 (Commit Message) 中提取第一个匹配的 GitHub URL
            COMMIT_MSG="${{ github.event.head_commit.message }}"
            TARGET_URL=$(echo "$COMMIT_MSG" | grep -oP 'https://github\.com/[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+' | head -n 1)
          fi

          # 如果最终没有提取到 URL，则报错退出
          if [ -z "$TARGET_URL" ]; then
            echo "::error::未在日志中找到有效的 GitHub URL。请确保日志包含 https://github.com/user/repo"
            exit 1
          fi

          # 提取纯仓库名
          REPO_NAME=$(echo "$TARGET_URL" | sed 's/.*\///;s/\.git$//')
          FILENAME="${REPO_NAME}_${DATE}.7z"

          echo "target_url=$TARGET_URL" >> $GITHUB_OUTPUT
          echo "repo_name=$REPO_NAME" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

          echo "--------------------------------------------------"
          echo "Detected URL: $TARGET_URL"
          echo "Target File: $FILENAME"
          echo "--------------------------------------------------"

      - name: Clone Remote Repository
        id: clone
        continue-on-error: true
        run: |
          git clone --depth 1 ${{ steps.vars.outputs.target_url }} ./target_repo

      - name: Compress to 7z
        if: steps.clone.outcome == 'success'
        run: |
          sudo apt-get install -y p7zip-full
          # 7z a -t7z "${{ steps.vars.outputs.filename }}" ./target_repo/* -xr'!.git'
          7z a -t7z "${{ steps.vars.outputs.filename }}" ./target_repo

      - name: Upload Artifact
        uses: actions/upload-artifact@v4.4.3
        with:
          name: archive-payload
          path: "*.7z"

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: archive-payload

      - name: Upload to Release
        if: needs.build.outputs.clone_status == 'success'
        uses: softprops/action-gh-release@v2
        with:
          files: "*.7z"
          tag_name: ${{ needs.build.outputs.date }}
          name: "Archive: ${{ needs.build.outputs.repo_name }} (${{ needs.build.outputs.date }})"
          body: |
            ### 归档报告
            - **源仓库**: ${{ needs.build.outputs.target_url }}
            - **打包日期**: ${{ needs.build.outputs.date }}
            - **提取来源**: ${{ github.event_name == 'push' && 'Commit Message' || 'Manual Input' }}
          make_latest: true

      - name: Post Error Release
        if: needs.build.outputs.clone_status == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "url_error_${{ github.run_id }}"
          name: "Error: Clone Failed"
          body: "无法连接到从日志中提取的 URL: `${{ needs.build.outputs.target_url }}`"